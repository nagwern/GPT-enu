name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack project from parts
        run: |
          mapfile -t FILES < <(find . -not -path "./.git/*" -iname "part-*.txt" | sort)
          echo "Found ${#FILES[@]} part file(s):"
          printf '%s\n' "${FILES[@]}"
          if [ "${#FILES[@]}" -ne 6 ]; then
            echo "::error::Expected exactly 6 part files (part-0.txt .. part-5.txt), found ${#FILES[@]}. Check the list above for duplicates, missing files, or wrong folders."
            exit 1
          fi
          mkdir -p proj
          cat "${FILES[@]}" | tr -d ' \r\n' | base64 -d > proj.txz
          echo "Archive size:"
          ls -la proj.txz
          tar xJf proj.txz -C proj
          echo "Unpacked project:"
          find proj -maxdepth 2

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-MENU-V5.0-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
          
